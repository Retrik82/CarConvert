# Postgres keeps users/history across redeploys. SQLite in /tmp was wiped on every deploy.
databases:
  - name: carconvert-db
    databaseName: carconvert
    user: carconvert
    plan: free

services:
  - type: web
    name: carconvert-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: carconvert-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /tmp/carconvert/uploads

  - type: web
    name: carconvert-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://carconvert-api.onrender.com
