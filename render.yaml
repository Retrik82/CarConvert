# Production: PostgreSQL (persistent data) + Persistent Disk (photo uploads).
databases:
  - name: carconvert-db
    plan: basic-256mb
    diskSizeGB: 5

services:
  - type: web
    name: carconvert-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from main import app; print('Import OK:', app.title)" && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: carconvert-uploads
      mountPath: /var/data/uploads
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: carconvert-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads

  - type: web
    name: carconvert-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://carconvert-api.onrender.com
