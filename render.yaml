# SQLite in /tmp for MVP deploy. Data resets on redeploy; switch to Postgres later for persistence.
services:
  - type: web
    name: carconvert-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start_render.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////tmp/carconvert/carconvert.db
      - key: UPLOAD_DIR
        value: /tmp/carconvert/uploads

  - type: web
    name: carconvert-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://carconvert-api.onrender.com
